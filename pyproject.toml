[project]
name = "moeforge"
version = "0.1.0"
description = "Topology-aware MoE inference optimizer"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moeforge*"]
