[project]
name = "MoE-Inference-Lab"
version = "0.1.0"
description = "A generic starter for topology-aware MoE inference analysis"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF022"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moeforge*"]
